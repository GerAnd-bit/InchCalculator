<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="google-site-verification" content=<meta name="google-site-verification"
    content="taTTDTsoHG5UJOY-0FmsExdfpdqU_U32Gtu4G0vPk80" /> />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" />
  <meta name="author" content="GerAnd-bit" />
  <meta name="copyright" content="Copyright © 2026 GerAnd-bit. All rights reserved." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Inch Calc" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />

  <script>
    (() => {
      const savedTheme = localStorage.getItem("inchcalculator-theme") || "system";
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = savedTheme === "dark" || (savedTheme === "system" && systemDark);

      document.documentElement.dataset.theme = savedTheme;
      document.documentElement.classList.toggle("dark-mode", isDark);
    })();
  </script>

  <title>Inch Calculator</title>
</head>

<body>
  <main class="calculator" aria-label="Inch calculator">

    <header>
      <p class="eyebrow">INCH CALCULATOR</p>

      <div class="header-actions">
        <button class="history-button" id="history-toggle" type="button" aria-expanded="false"
          aria-controls="history-panel">
          <span aria-hidden="true">◷</span>
          <span>History</span>
        </button>

        <button class="clear-button" id="clear" type="button">Clear</button>

        <button class="theme-button" id="theme-toggle" type="button" aria-label="Appearance settings"
          aria-expanded="false">
          ◐
        </button>
      </div>
    </header>

    <section class="display" aria-live="polite">
      <p class="expression" id="expression">0″</p>
      <p class="result" id="result">0′ 0″</p>

      <div class="result-footer">
        <span id="total-inches">0 inches</span>

        <button class="copy-button" id="copy" type="button" aria-label="Copy result">
          <span aria-hidden="true">⧉</span>
          <span id="copy-label">Copy</span>
        </button>
      </div>
    </section>

    <section class="keypad" aria-label="Calculator keypad">
      <button data-action="clear" class="utility" type="button">AC</button>
      <button data-action="backspace" class="utility" type="button" aria-label="Delete last entry">⌫</button>
      <button data-token="′" class="unit" type="button">ft</button>
      <button data-token=" ″" class="unit" type="button">in</button>

      <button data-token="7" type="button">7</button>
      <button data-token="8" type="button">8</button>
      <button data-token="9" type="button">9</button>
      <button data-token="−" class="operator" type="button">−</button>

      <button data-token="4" type="button">4</button>
      <button data-token="5" type="button">5</button>
      <button data-token="6" type="button">6</button>
      <button data-token="+" class="operator" type="button">+</button>

      <button data-token="1" type="button">1</button>
      <button data-token="2" type="button">2</button>
      <button data-token="3" type="button">3</button>
      <button data-action="equals" class="equals" type="button">=</button>

      <button data-token="0" class="zero" type="button">0</button>
    </section>

    <section class="fractions" aria-label="Fraction shortcuts">
      <button data-fraction="1/16" type="button">1/16</button>
      <button data-fraction="1/8" type="button">1/8</button>
      <button data-fraction="3/16" type="button">3/16</button>
      <button data-fraction="1/4" type="button">1/4</button>

      <button data-fraction="5/16" type="button">5/16</button>
      <button data-fraction="3/8" type="button">3/8</button>
      <button data-fraction="7/16" type="button">7/16</button>
      <button data-fraction="1/2" type="button">1/2</button>

      <button data-fraction="9/16" type="button">9/16</button>
      <button data-fraction="5/8" type="button">5/8</button>
      <button data-fraction="11/16" type="button">11/16</button>
      <button data-fraction="3/4" type="button">3/4</button>

      <button data-fraction="13/16" type="button">13/16</button>
      <button data-fraction="7/8" type="button">7/8</button>
      <button data-fraction="15/16" type="button">15/16</button>
      <button data-fraction="1" type="button">1</button>
    </section>

    <!-- Appearance settings -->
    <aside class="theme-panel" id="theme-panel" hidden>
      <div class="theme-header">
        <span class="theme-title">Appearance</span>
        <button class="theme-close" id="theme-close" type="button" aria-label="Close settings">×</button>
      </div>

      <div class="theme-options" role="group" aria-label="Theme selection">
        <button data-theme-choice="system" type="button">System</button>
        <button data-theme-choice="light" type="button">Light</button>
        <button data-theme-choice="dark" type="button">Dark</button>
      </div>
    </aside>

    <!-- History -->
    <aside class="history-panel" id="history-panel" aria-label="Calculation history" aria-hidden="true" hidden>
      <div class="history-header">
        <div>
          <p class="eyebrow">RECENT</p>
          <h2>History</h2>
        </div>

        <button class="history-close" id="history-close" type="button" aria-label="Close history">×</button>
      </div>

      <div class="history-list" id="history-list"></div>
      <button class="clear-history" id="clear-history" type="button">Clear History</button>
    </aside>

    <!-- Theme behavior -->
    <script>
      (() => {
        const themePanel = document.getElementById("theme-panel");
        const themeToggle = document.getElementById("theme-toggle");
        const themeClose = document.getElementById("theme-close");
        const themeButtons = document.querySelectorAll("[data-theme-choice]");
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

        function applyTheme(theme) {
          const dark = theme === "dark" || (theme === "system" && mediaQuery.matches);

          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark-mode", dark);

          const themeColor = dark ? "#000000" : "#f2f2f7";
          document.querySelector('meta[name="theme-color"]').content = themeColor;

          themeButtons.forEach(button => {
            const selected = button.dataset.themeChoice === theme;
            button.classList.toggle("selected", selected);
            button.setAttribute("aria-pressed", String(selected));
          });
        }

        function closeThemePanel() {
          themePanel.hidden = true;
          themeToggle.setAttribute("aria-expanded", "false");
        }

        themeToggle.addEventListener("click", () => {
          themePanel.hidden = !themePanel.hidden;
          themeToggle.setAttribute("aria-expanded", String(!themePanel.hidden));
        });

        themeClose.addEventListener("click", closeThemePanel);

        themeButtons.forEach(button => {
          button.addEventListener("click", () => {
            const theme = button.dataset.themeChoice;
            localStorage.setItem("inchcalculator-theme", theme);
            applyTheme(theme);
          });
        });

        mediaQuery.addEventListener("change", () => {
          if (document.documentElement.dataset.theme === "system") {
            applyTheme("system");
          }
        });

        document.addEventListener("click", event => {
          if (
            !themePanel.hidden &&
            !themePanel.contains(event.target) &&
            event.target !== themeToggle
          ) {
            closeThemePanel();
          }
        });

        applyTheme(localStorage.getItem("inchcalculator-theme") || "system");
      })();
    </script>

  </main>

  <footer class="copyright">
    © 2026 GerAnd-bit · All rights reserved.
  </footer>

  <script src="calc-core.js"></script>
  <script src="history-store.js"></script>
  <script src="app.js"></script>
</body>

</html>
